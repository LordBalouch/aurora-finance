name: Desktop app

# Builds the packaged app for macOS and Windows, starts it once as a smoke test, and uploads
# it. A tag like v1.0.0 also attaches the zips to a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: Aurora-macOS
            exe: dist/Aurora/Aurora
          - os: windows-latest
            name: Aurora-Windows
            exe: dist/Aurora/Aurora.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-desktop.txt
      - run: pyinstaller --noconfirm --log-level WARN desktop/aurora.spec
      - name: Smoke test (start, answer, stop)
        env:
          AURORA_DATA_DIR: ${{ runner.temp }}/aurora-data
          AURORA_NO_BROWSER: "1"
        run: |
          "${{ matrix.exe }}" > app.log 2>&1 &
          for i in $(seq 1 120); do
            curl -sf http://127.0.0.1:8765/ping/ && break
            sleep 1
          done
          for p in / /ask/ /settings/ /import/ /static/css/app.css; do
            curl -sf -o /dev/null "http://127.0.0.1:8765$p" || { cat app.log; exit 1; }
          done
          cat app.log
      - name: Zip
        run: |
          cd dist
          if [ "${{ runner.os }}" = "macOS" ]; then
            ditto -c -k --keepParent Aurora.app ../${{ matrix.name }}.zip
          else
            7z a ../${{ matrix.name }}.zip Aurora > /dev/null
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The two builds finish at different times: whichever is first creates the release.
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" \
            --notes "See the README section Download." 2>/dev/null || true
          gh release upload "${{ github.ref_name }}" "${{ matrix.name }}.zip" --clobber
