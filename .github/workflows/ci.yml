name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Django checks
        env:
          DB_PATH: ":memory:"
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest --cov=insights --cov=ledger --cov=ai --cov=web --cov=desktop --cov-report=term --cov-fail-under=90
