{% if form.non_field_errors %}<p class="msg msg-error">{{ form.non_field_errors|join:" " }}</p>{% endif %}
<div class="form-grid">
  {% for f in form %}
  <div class="field{% if f.field.widget.input_type == 'textarea' or f.name == 'notes' %} wide{% endif %}">
    <label for="{{ f.id_for_label }}">{{ f.label }}</label>
    {{ f }}
    {% if f.help_text %}<small class="help">{{ f.help_text }}</small>{% endif %}
    {% for e in f.errors %}<small class="error">{{ e }}</small>{% endfor %}
  </div>
  {% endfor %}
</div>
